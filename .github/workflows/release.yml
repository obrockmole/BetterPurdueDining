name: Generate Release Files

on:
  release:
    types: [published]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: write 
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew :androidApp:assembleRelease :desktopApp:packageDeb

      - name: Upload
        uses: softprops/action-gh-release@v2
        with:
          files: |
            androidApp/build/outputs/apk/release/*.apk
            desktopApp/build/compose/binaries/main/*/*.deb

  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write 
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build
        run: .\gradlew.bat :desktopApp:packageMsi :desktopApp:packageExe

      - name: Upload
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktopApp/build/compose/binaries/main/*/*.msi
            desktopApp/build/compose/binaries/main/*/*.exe

  build-macos:
    runs-on: macos-latest
    permissions:
      contents: write 
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew :desktopApp:packageDmg

      - name: Upload
        uses: softprops/action-gh-release@v2
        with:
          files: desktopApp/build/compose/binaries/main/*/*.dmg